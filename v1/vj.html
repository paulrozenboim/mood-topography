<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Topography of Us — VJ panel</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <div class="vj">
    <div>
      <div class="eyebrow">Operator</div>
      <h2 style="font-size:22px;margin-top:8px">VJ panel</h2>
      <div class="readout" style="margin-top:6px">Overrides the projection live. Auto-pilot resumes when you switch it back on.</div>
      <div class="status-pill" id="statusPill" style="margin-top:10px"><i></i><span id="statusText">Local demo mode — this device only</span></div>
    </div>

    <div>
      <h2>Projection state</h2>
      <div class="grid" id="grid"></div>
      <div class="row" style="margin-top:8px">
        <button class="chip" id="autoBtn">Auto-pilot<b>cycles every 14s</b></button>
      </div>
    </div>

    <div>
      <h2>Theme</h2>
      <div class="row">
        <button class="chip" id="tProj">Projection<b>dark / light</b></button>
        <button class="chip" id="tTab">Tablet<b>dark / light</b></button>
      </div>
    </div>

    <div>
      <h2>Tonight's data</h2>
      <div class="row">
        <button class="chip" id="seedBtn">Seed demo data<b>rehearsal only</b></button>
        <button class="chip" id="rehBtn">Live rehearsal<b>a cast every 6s</b></button>
        <button class="chip danger" id="clearSeedBtn">Clear demo data<b>keeps real casts</b></button>
        <button class="chip danger" id="clearAllBtn">Clear everything<b>destructive</b></button>
      </div>
    </div>

    <div>
      <h2>Tonight, in numbers</h2>
      <div class="readout" id="ro"></div>
    </div>

    <div>
      <h2>Bulletin queue</h2>
      <div class="readout" id="bq"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/core.js"></script>
<script src="assets/seed.js"></script>
<script>
"use strict";
const el=(tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e};

const modes=[
  ["All paths",{type:"all"},"everything cast tonight"],
  ["Recent 12",{type:"recent"},"the last few minutes"],
  ["Heaviest links",{type:"heaviest"},"top 5 segments"],
  ["Sole traveller",{type:"outlier"},"the least-shared route"],
  ["Friction",{type:"cat",c:"F"},"line F"],
  ["Foundations",{type:"cat",c:"R"},"line R"],
  ["Connection",{type:"cat",c:"C"},"line C"],
  ["Momentum",{type:"cat",c:"M"},"line M"],
  ["Blank",{type:"blank"},"clear the wall"]
];
const grid=document.getElementById("grid");
const chips=modes.map(([label,f,hint])=>{
  const b=el("button","chip",`${label}<b>${hint}</b>`);
  b.onclick=()=>{ Store.setAuto(false); Store.setFilter(f) };
  b._f=f; grid.appendChild(b); return b;
});

const autoBtn=document.getElementById("autoBtn");
autoBtn.onclick=()=>Store.setAuto(!Store.auto);

document.getElementById("tProj").onclick=()=>Store.setTheme("projection",Store.theme.projection==="dark"?"light":"dark");
document.getElementById("tTab").onclick=()=>Store.setTheme("tablet",Store.theme.tablet==="dark"?"light":"dark");

document.getElementById("seedBtn").onclick=()=>seedPaths(60);
document.getElementById("clearSeedBtn").onclick=()=>{ if(confirm("Remove all demo/rehearsal paths? Real casts tonight are kept.")) Store.clearSeeded() };
document.getElementById("clearAllBtn").onclick=()=>{ if(confirm("Clear EVERY path — including real casts tonight? This can't be undone.")) Store.clear() };

let rehIv=null;
const rehBtn=document.getElementById("rehBtn");
rehBtn.onclick=()=>{
  if(rehIv){ clearInterval(rehIv); rehIv=null; rehBtn.setAttribute("aria-pressed","false") }
  else{ rehIv=setInterval(()=>Store.addPath(randomPath(true)),6000); rehBtn.setAttribute("aria-pressed","true") }
};

const ro=document.getElementById("ro"), bq=document.getElementById("bq");
function refresh(){
  chips.forEach(b=>b.setAttribute("aria-pressed", JSON.stringify(b._f)===JSON.stringify(Store.filter) && !Store.auto ? "true":"false"));
  autoBtn.setAttribute("aria-pressed", Store.auto?"true":"false");
  const A=analyse(Store.paths);
  ro.innerHTML = A.total
    ? `Real casts <b>${A.real}</b> &nbsp;·&nbsp; Demo paths <b>${A.seeded}</b><br>
       Distinct routes <b>${A.distinct}</b><br>
       Busiest station <b>${A.topNode?A.topNode.n:"—"}</b><br>
       Most common anchor <b>${A.topAnchor?A.topAnchor.n:"—"}</b><br>
       Most common destination <b>${A.topEnd?A.topEnd.n:"—"}</b><br>
       Unvisited stations <b>${A.untouched.length}</b>`
    : `No paths yet. Seed demo data to rehearse, or clear it once real casting begins.`;
  bq.innerHTML = bulletins(A).map(b=>`<div>› ${b.line.replace(/[{}]/g,"")}</div>`).join("");
}
Store.sub(refresh); refresh();

const pill=document.getElementById("statusPill"), statusText=document.getElementById("statusText");
Sync.onStatus(mode=>{
  pill.classList.toggle("remote", mode==="remote");
  statusText.textContent = mode==="remote"
    ? "Connected — synced across devices"
    : "Local demo mode — this device only";
});
Sync.hello();
</script>
</body>
</html>
