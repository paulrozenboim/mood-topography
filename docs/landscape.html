<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mood Topography — 3D landscape</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{overflow:hidden}
  #app{position:fixed;inset:0;display:block}
  canvas#scene{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas#scene:active{cursor:grabbing}
  .hud{position:absolute;pointer-events:none;font-family:'Martian Mono',monospace;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);text-shadow:0 1px 4px rgba(0,0,0,.55)}
  .hud.tl{top:var(--pad);left:var(--pad)}
  .hud.br{bottom:var(--pad);right:var(--pad);text-align:right;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
  .hud .eyebrow{font-size:9px;color:var(--ink-3);letter-spacing:.24em}
  .hud h1{font-size:clamp(16px,2.3vw,26px);font-weight:800;font-variation-settings:'wdth' 116;
    color:var(--ink);margin-top:6px;line-height:1.05;text-shadow:0 2px 8px rgba(0,0,0,.55)}
  .hud .meta{font-size:10px;color:var(--ink-3);margin-top:8px;line-height:1.7}
  .hud .meta b{color:var(--ink-2);font-weight:600}
  .hud .keys{font-size:9px;color:var(--ink-3);line-height:1.7}
  .hud .keys b{color:var(--ink);font-weight:700;background:rgba(127,127,127,.14);padding:1px 5px}
  .hud .control-panel{background:var(--panel);box-shadow:inset 0 0 0 1px var(--hair);
    backdrop-filter:blur(8px);pointer-events:auto;display:flex;flex-direction:column;min-width:300px}
  .hud .slider-row{display:flex;align-items:center;gap:10px;padding:6px 12px}
  .hud .slider-row + .slider-row{padding-top:0}
  .hud .slider-row label{font-size:9px;color:var(--ink-3);letter-spacing:.18em;width:3.2em}
  .hud .slider-row input[type=range]{flex:1;accent-color:var(--ink-2);cursor:ew-resize}
  .hud .slider-row .val{font-size:9px;color:var(--ink);width:2.8em;text-align:right;font-weight:700}
  .hud .anim-row{display:flex;justify-content:space-between;gap:2px;padding:6px 6px 6px;
    border-top:1px solid var(--hair);margin-top:4px}
  .hud .anim-row button{background:transparent;color:var(--ink-3);border:0;padding:5px 8px;cursor:pointer;
    font-family:'Martian Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;
    display:flex;align-items:center;justify-content:center;gap:5px;flex:1}
  .hud .anim-row button:hover{color:var(--ink)}
  .hud .anim-row button.on{color:var(--ink);background:rgba(127,127,127,.14)}
  .hud .anim-row button svg{width:12px;height:12px;display:block}
  .corner-btns{position:absolute;top:var(--pad);right:var(--pad);display:flex;gap:6px;pointer-events:auto;z-index:6}
  .corner-btns .corner-btn{position:relative;top:auto;right:auto}
</style>
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div class="hud tl">
    <div class="eyebrow">3D · Mood landscape</div>
    <h1>The Mood Topography</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div class="hud br">
    <div class="control-panel">
      <div class="slider-row">
        <label>Height</label>
        <input type="range" id="heightSlider" min="0" max="200" value="45" step="1">
        <span class="val" id="heightVal">45%</span>
      </div>
      <div class="slider-row">
        <label>Size</label>
        <input type="range" id="sizeSlider" min="0" max="100" value="10" step="1">
        <span class="val" id="sizeVal">10%</span>
      </div>
      <div class="slider-row">
        <label>Opacity</label>
        <input type="range" id="opacitySlider" min="0" max="200" value="75" step="1">
        <span class="val" id="opacityVal">75%</span>
      </div>
      <div class="anim-row" id="animRow"></div>
    </div>
    <div class="keys">
      <b>drag</b> rotate · <b>middle-drag</b> pan · <b>wheel</b> zoom · <b>R</b> reset · <b>Space</b> auto-rotate · <b>P</b> screenshot
    </div>
  </div>
  <div class="corner-btns" id="corners"></div>
</div>

<script src="assets/icons.js"></script>
<script src="assets/remote-config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/core.js"></script>
<script src="assets/nav.js"></script>
<script>
"use strict";

/* ============================================================
   3D LANDSCAPE — a custom canvas pipeline (no Three.js). Stations occupy the
   X-Z plane at the flat map's coordinates; Y is traffic-derived height, scaled
   by the Height slider. Left-drag rotates (pitch is fully free — top-down,
   side-on, or below the floor), middle-drag pans, wheel zooms. The Size slider
   controls how strongly cap radius reflects a station's traffic.
   ============================================================ */

const cv = document.getElementById("scene");
const ctx = cv.getContext("2d");
const meta = document.getElementById("meta");
const corners = document.getElementById("corners");
const heightSlider = document.getElementById("heightSlider");
const heightVal = document.getElementById("heightVal");
const sizeSlider = document.getElementById("sizeSlider");
const sizeVal = document.getElementById("sizeVal");
const opacitySlider = document.getElementById("opacitySlider");
const opacityVal = document.getElementById("opacityVal");

document.documentElement.dataset.theme = Store.theme;

// ---- Camera state --------------------------------------------------------
// Frontal-with-a-tilt: yaw=0 lines up left/right with the tablet/projection;
// a small negative pitch drops the horizon so height columns stay visible.
const INIT_YAW = 0, INIT_PITCH = -0.35, INIT_DIST = 875;
let yaw = INIT_YAW, pitch = INIT_PITCH;
let dist = INIT_DIST;
let panX = 0, panY = 0;                 // screen-space translation
let autoRotate = false;                 // off by default so the initial view is stable
let showPaths = true;
let heightScale = 0.45;                  // 0..2 — user-controlled height multiplier
let sizeContrast = 0.10;                 // 0..1 — cap-radius spread across traffic
let pathOpacity = 0.75;                  // 0..2 — user-controlled path alpha multiplier
let dragMode = null;                     // "rotate" | "pan" | null
let dragStart = null;
// Path animation controller. Time-based so stagger (in ALL) and repeat gaps
// fall out naturally.
//   mode: null     — no animation, all paths drawn statically
//         "single" — draws one specific path, stops on completion
//         "seq"    — cycles paths one after another (always loops)
//         "together"— every path draws simultaneously, staggered starts
//   index:   focus path (for single/seq; ignored by together)
//   t:       seconds since the current cycle started
//   playing: false pauses time advancement in place
//   repeat:  when true, single/together loop; seq always loops regardless
let anim = { mode:null, index:0, t:0, playing:false, repeat:false };
const ANIM_DURATION = 3.2;               // seconds to draw one path start-to-end
const ALL_STAGGER   = 0.35;              // per-path start offset in ALL mode
const REPEAT_GAP    = 0.9;               // pause between cycles when repeat is on

// Linear interpolation between two #RRGGBB colors → 'rgb(r,g,b)'. Cheap enough
// to call per spline segment; drives the gradient stroke below.
function hexLerp(a, b, t){
  const pa = a.replace('#',''), pb = b.replace('#','');
  const ar=parseInt(pa.slice(0,2),16), ag=parseInt(pa.slice(2,4),16), ab=parseInt(pa.slice(4,6),16);
  const br=parseInt(pb.slice(0,2),16), bg=parseInt(pb.slice(2,4),16), bb=parseInt(pb.slice(4,6),16);
  const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), b2=Math.round(ab+(bb-ab)*t);
  return `rgb(${r},${g},${b2})`;
}
const FOV = 720;
let cx = 0, cy = 0;

const WORLD_BOX = {w:1400, h:820};
const worldCenter = {x: WORLD_BOX.w/2, y: 0, z: WORLD_BOX.h/2};

function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, r.width*dpr);
  cv.height = Math.max(1, r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx = r.width/2; cy = r.height/2;
}
addEventListener("resize", resize); resize();

// ---- 3D → 2D projection --------------------------------------------------
// dz is negated so the bottom of the tablet map (high n.y) sits *closer* to
// the camera — matches the left/right/top/bottom convention of the tablet and
// the projection wall.
function project(wx, wy, wz){
  const x = wx - worldCenter.x;
  const z = worldCenter.z - wz;
  const y = wy - worldCenter.y;
  const cy_ = Math.cos(yaw),  sy_ = Math.sin(yaw);
  const cp_ = Math.cos(pitch), sp_ = Math.sin(pitch);
  const x1 = x*cy_ - z*sy_;
  const z1 = x*sy_ + z*cy_;
  const y2 = y*cp_ - z1*sp_;
  const z2 = y*sp_ + z1*cp_;
  const zc = z2 + dist;
  if(zc <= 1) return null;
  const s = FOV / zc;
  return { x: cx + x1*s + panX, y: cy - y2*s + panY, depth: zc, scale: s };
}

// ---- Traffic → height ----------------------------------------------------
let maxTraffic = 0;
function computeMaxTraffic(){
  const A = analyse(Store.paths);
  maxTraffic = Math.max(1, ...A.traffic);
  return A;
}
const MAX_HEIGHT = 700;    // world units, height of the tallest station at 100%
function stationHeight(id, traffic){
  const t = (traffic[id]||0) / maxTraffic;
  // pow 0.6 — mid-traffic stations rise more visibly than sqrt(t) gave.
  return Math.pow(t, 0.6) * MAX_HEIGHT * heightScale;
}

// ---- Theme-reactive palette ---------------------------------------------
function palette(){
  const rs = getComputedStyle(document.documentElement);
  const dark = Store.theme === "dark";
  return {
    dark,
    bgOuter: dark ? "#050608" : (rs.getPropertyValue("--bg").trim() || "#E9EBEA"),
    bgInner: dark ? "#101418" : (rs.getPropertyValue("--bg-2").trim() || "#F4F5F4"),
    ink:     rs.getPropertyValue("--ink").trim(),
    ink2:    rs.getPropertyValue("--ink-2").trim(),
    ink3:    rs.getPropertyValue("--ink-3").trim(),
    hair:    rs.getPropertyValue("--hair").trim(),
    grid:    dark ? "rgba(140,160,180,.32)" : "rgba(30,40,55,.34)",
    axis:    dark ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.22)",
    plate:   dark ? "rgba(0,0,0,.65)"      : "rgba(255,255,255,.85)",
    pathComp: dark ? "lighter" : "multiply",
    pathReal: dark ? 0.55 : 0.68,
    pathSeed: dark ? 0.22 : 0.28,
  };
}

// ---- Draw helpers --------------------------------------------------------
function dashedLine(p0, p1, dash=6, gap=6, alpha=1){
  const dx = p1.x - p0.x, dy = p1.y - p0.y;
  const len = Math.hypot(dx, dy);
  if(len < 0.1) return;
  const ux = dx/len, uy = dy/len;
  ctx.save();
  ctx.globalAlpha = alpha;
  let t = 0;
  while(t < len){
    const t1 = Math.min(len, t + dash);
    ctx.beginPath();
    ctx.moveTo(p0.x + ux*t, p0.y + uy*t);
    ctx.lineTo(p0.x + ux*t1, p0.y + uy*t1);
    ctx.stroke();
    t = t1 + gap;
  }
  ctx.restore();
}

// Stroke a polyline where color drifts from one node's mood color to the next.
// scr is the screen-projected spline; colors is one color per original path
// node (length = p.nodes.length). Each spline segment picks its color by
// interpolating between the two node colors it sits between along the path.
function drawGradientStroke(scr, colors, cutoff, alpha, lineWidth, comp){
  const end = Math.min(cutoff, scr.length);
  if(end < 2 || alpha <= 0) return;
  const total = scr.length - 1;
  const N = colors.length;
  ctx.save();
  ctx.globalCompositeOperation = comp;
  ctx.lineWidth = lineWidth;
  ctx.lineCap = "round";
  ctx.globalAlpha = alpha;
  for(let i=0; i<end-1; i++){
    const tPath = (i + 0.5) / total * (N - 1);
    const seg = Math.min(N - 2, Math.max(0, Math.floor(tPath)));
    ctx.strokeStyle = hexLerp(colors[seg], colors[seg+1], tPath - seg);
    ctx.beginPath();
    ctx.moveTo(scr[i].x, scr[i].y);
    ctx.lineTo(scr[i+1].x, scr[i+1].y);
    ctx.stroke();
  }
  ctx.restore();
}

function spline3D(pts, samples=18){
  if(pts.length < 2) return pts.slice();
  const P = [pts[0], ...pts, pts[pts.length-1]];
  const out = [];
  for(let i=1; i<P.length-2; i++){
    const p0=P[i-1], p1=P[i], p2=P[i+1], p3=P[i+2];
    for(let t=0; t<1; t+=1/samples){
      const t2=t*t, t3=t2*t;
      const x=.5*((2*p1.x)+(-p0.x+p2.x)*t+(2*p0.x-5*p1.x+4*p2.x-p3.x)*t2+(-p0.x+3*p1.x-3*p2.x+p3.x)*t3);
      const y=.5*((2*p1.y)+(-p0.y+p2.y)*t+(2*p0.y-5*p1.y+4*p2.y-p3.y)*t2+(-p0.y+3*p1.y-3*p2.y+p3.y)*t3);
      const z=.5*((2*p1.z)+(-p0.z+p2.z)*t+(2*p0.z-5*p1.z+4*p2.z-p3.z)*t2+(-p0.z+3*p1.z-3*p2.z+p3.z)*t3);
      out.push({x,y,z});
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}

// ---- Frame -------------------------------------------------------------
let lastTs = performance.now();
function frame(ts){
  const dt = Math.min(0.05, (ts - lastTs)/1000);
  lastTs = ts;
  if(autoRotate && !dragMode) yaw += dt * 0.14;
  advanceAnim(dt);
  const A = computeMaxTraffic();
  const P = palette();

  const r = cv.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  const grad = ctx.createRadialGradient(cx, cy*0.6, 60, cx, cy*0.6, Math.max(r.width, r.height));
  grad.addColorStop(0, P.bgInner);
  grad.addColorStop(1, P.bgOuter);
  ctx.fillStyle = grad; ctx.fillRect(0,0,r.width,r.height);

  // ----- Grid on the X-Z plane (Y=0) -----
  ctx.strokeStyle = P.grid; ctx.lineWidth = 1;
  const STEP = 100, minor = 3;
  for(let i=-4; i<=WORLD_BOX.w/STEP + 4; i++){
    const x = i*STEP;
    const a = project(x, 0, -400);
    const b = project(x, 0, WORLD_BOX.h + 400);
    if(!a || !b) continue;
    dashedLine(a, b, 3, minor, 0.35);
  }
  for(let j=-4; j<=WORLD_BOX.h/STEP + 4; j++){
    const z = j*STEP;
    const a = project(-400, 0, z);
    const b = project(WORLD_BOX.w + 400, 0, z);
    if(!a || !b) continue;
    dashedLine(a, b, 3, minor, 0.35);
  }

  // ----- Vertical axis reference at world center -----
  const axisTop = project(worldCenter.x, MAX_HEIGHT * heightScale + 60, worldCenter.z);
  const axisBase = project(worldCenter.x, 0, worldCenter.z);
  if(axisTop && axisBase){
    ctx.strokeStyle = P.axis; ctx.lineWidth = 1;
    dashedLine(axisBase, axisTop, 4, 6, 1);
  }

  // ----- Aggregate paths as 3D curves (skipped when hidden) -----
  if(showPaths){
    const pathsRender = [];
    let playableIdx = 0;
    for(const p of Store.paths){
      if(p.nodes.length < 2) continue;
      const worldPts = p.nodes.map(id => {
        const n = NODES[id];
        const h = stationHeight(id, A.traffic);
        // Land exactly on top of the station cap — the +offset before was
        // making paths hover above their anchors.
        return {x:n.x, y:h, z:n.y};
      });
      const spl = spline3D(worldPts, 16);
      const scr = spl.map(q => project(q.x, q.y, q.z)).filter(Boolean);
      if(scr.length < 2){ playableIdx++; continue; }
      const avgDepth = scr.reduce((a,b)=>a+b.depth,0) / scr.length;
      // idx is the position among *playable* paths — matches what
      // pathProgress() and playablePathCount() count.
      pathsRender.push({p, scr, avgDepth, idx:playableIdx});
      playableIdx++;
    }
    pathsRender.sort((a,b)=> b.avgDepth - a.avgDepth);
    const animating = anim.mode !== null;
    const together = anim.mode === "together";
    const playCount = pathsRender.length;
    for(const {p, scr, idx} of pathsRender){
      // Per-node colors so the stroke can drift from mood to mood along the
      // path — same "gradient path" effect as the flat map view.
      const colors = p.nodes.map(id => catColor(NODES[id].c, Store.theme));
      const baseAlpha = p.seeded ? P.pathSeed : P.pathReal;
      let alpha, cutoff, lineWidth;
      if(animating){
        const prog = pathProgress(idx, playCount);
        // Together: every path is a "focus". Single/seq: only the focused index
        // draws; other paths dim so the animation reads clearly.
        const isFocus = together || idx === anim.index;
        alpha = isFocus ? 1 : baseAlpha * 0.18;
        lineWidth = isFocus ? 2.6 : 1.6;
        cutoff = isFocus ? Math.max(2, Math.floor(scr.length * prog)) : scr.length;
        // In together mode a path not yet started (prog=0) should render nothing.
        if(together && prog <= 0) continue;
      } else {
        alpha = baseAlpha;
        lineWidth = 1.6;
        cutoff = scr.length;
      }
      alpha = Math.max(0, Math.min(1, alpha * pathOpacity));
      drawGradientStroke(scr, colors, cutoff, alpha, lineWidth, P.pathComp);
      // Bright head at the drawing tip — reads as "ink still flowing".
      const drawing = animating && cutoff < scr.length && cutoff >= 2;
      if(drawing){
        const head = scr[cutoff-1];
        const t = ((cutoff - 1) / Math.max(1, scr.length - 1)) * (colors.length - 1);
        const seg = Math.min(colors.length - 2, Math.floor(t));
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = hexLerp(colors[seg], colors[seg+1], t - seg);
        ctx.beginPath();
        ctx.arc(head.x, head.y, 4.5, 0, 7);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  // ----- Station columns + caps -----
  const stationRender = NODES.map(n => {
    const h = stationHeight(n.id, A.traffic);
    const base = project(n.x, 0, n.y);
    const top  = project(n.x, h, n.y);
    if(!base || !top) return null;
    return {n, h, base, top, depth:top.depth, traffic:A.traffic[n.id]||0};
  }).filter(Boolean).sort((a,b)=> b.depth - a.depth);

  // Cap radius: linear ramp from tNorm (traffic/peak). sizeContrast controls
  // the spread — at 0 every station is roughly the same size; at 1 the biggest
  // station is ~90 world-px across and the smallest is a dot.
  const capMaxPx = 4 + sizeContrast * 90;
  for(const st of stationRender){
    const col = catColor(st.n.c, Store.theme);
    const tNorm = st.traffic / maxTraffic;
    const capR = 2 + tNorm * capMaxPx;
    ctx.strokeStyle = col; ctx.lineWidth = 1.2;
    dashedLine(st.base, st.top, 5, 4, 0.75);
    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = col; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(st.base.x, st.base.y, Math.max(2, capR * 0.55 * st.base.scale), 0, 7);
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(st.top.x, st.top.y, capR, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  // ----- Station labels -----
  ctx.font = `600 10px 'Martian Mono',monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "bottom";
  for(const st of stationRender){
    if(!st.top || st.top.scale < 0.15) continue;
    const alpha = Math.min(1, st.top.scale * 3.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = P.plate;
    const txt = st.n.n.toUpperCase();
    const tw = ctx.measureText(txt).width;
    ctx.fillRect(st.top.x - tw/2 - 3, st.top.y - 22, tw + 6, 14);
    ctx.fillStyle = P.ink;
    ctx.fillText(txt, st.top.x, st.top.y - 10);
    if(st.traffic > 0){
      ctx.fillStyle = catColor(st.n.c, Store.theme);
      ctx.font = `700 9px 'Martian Mono',monospace`;
      ctx.fillText(String(st.traffic), st.top.x, st.top.y - 24);
      ctx.font = `600 10px 'Martian Mono',monospace`;
    }
    ctx.restore();
  }

  const real = Store.paths.filter(p=>!p.seeded).length;
  meta.innerHTML = `<b>${Store.paths.length}</b> total paths &middot; <b>${real}</b> real casts<br>` +
    `<b>${maxTraffic}</b> peak station traffic &middot; height ∝ traffic<sup>0.6</sup>`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- Input --------------------------------------------------------------
cv.addEventListener("pointerdown", e => {
  // Middle button (button===1) pans. Anything else rotates.
  dragMode = e.button === 1 ? "pan" : "rotate";
  autoRotate = false;
  dragStart = { x:e.clientX, y:e.clientY, yaw, pitch, panX, panY };
  cv.setPointerCapture(e.pointerId);
  if(dragMode === "pan") e.preventDefault();
});
cv.addEventListener("pointermove", e => {
  if(!dragMode) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if(dragMode === "pan"){
    panX = dragStart.panX + dx;
    panY = dragStart.panY + dy;
  } else {
    // No pitch clamp — camera is fully free: top-down, side-on, from below,
    // whatever the user wants. Only clamped to ±π so drag can't run away.
    yaw = dragStart.yaw + dx * 0.005;
    pitch = Math.max(-Math.PI, Math.min(Math.PI, dragStart.pitch - dy * 0.005));
  }
});
const endDrag = () => { dragMode = null; };
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
// Suppress the browser's default middle-click autoscroll on Windows.
cv.addEventListener("auxclick", e => { if(e.button === 1) e.preventDefault(); });
cv.addEventListener("wheel", e => {
  e.preventDefault();
  dist = Math.max(250, Math.min(4500, dist * (e.deltaY > 0 ? 1.1 : 1/1.1)));
}, {passive:false});

function resetCamera(){
  yaw = INIT_YAW; pitch = INIT_PITCH; dist = INIT_DIST; panX = 0; panY = 0;
}

addEventListener("keydown", e => {
  if(e.key === "r" || e.key === "R") resetCamera();
  if(e.key === " "){ e.preventDefault(); autoRotate = !autoRotate; }
  if(e.key === "p" || e.key === "P"){
    const link = document.createElement("a");
    link.download = `mood-topography-3d-${Date.now()}.png`;
    link.href = cv.toDataURL("image/png");
    link.click();
  }
});

// ---- Path animation controller ------------------------------------------
// Order matches Store.paths (insertion order = cast order, seeded first).
function playablePathCount(){
  return Store.paths.filter(p => p.nodes.length >= 2).length;
}
// How long a full ALL cycle lasts: last path's start + its draw + repeat gap.
function togetherCycle(count){
  return ANIM_DURATION + Math.max(0, count-1) * ALL_STAGGER + REPEAT_GAP;
}
function advanceAnim(dt){
  if(!anim.mode || !anim.playing) return;
  const count = playablePathCount();
  if(!count){ animStop(); return; }
  anim.t += dt;
  if(anim.mode === "seq"){
    // Default: after each path completes, advance to the next (one-after-another).
    // With Repeat on: loop the SAME current path over and over instead.
    if(anim.t >= ANIM_DURATION){
      if(!anim.repeat) anim.index = (anim.index + 1) % count;
      anim.t = 0;
    }
  } else if(anim.mode === "single"){
    if(anim.t >= ANIM_DURATION){
      if(anim.repeat){ anim.t = 0; }
      else { anim.t = ANIM_DURATION; anim.playing = false; syncAnimButtons(); }
    }
  } else if(anim.mode === "together"){
    const cycle = togetherCycle(count);
    if(anim.t >= cycle){
      if(anim.repeat){ anim.t = 0; }
      else { anim.t = cycle; anim.playing = false; syncAnimButtons(); }
    }
  }
}
function animStart(mode, indexDelta){
  const count = playablePathCount();
  if(!count) return;
  if(!anim.mode){ anim.index = 0; }
  else if(indexDelta){ anim.index = (anim.index + indexDelta + count) % count; }
  anim.mode = mode;
  anim.t = 0;
  anim.playing = true;
  syncAnimButtons();
}
function animTogglePlay(){
  if(!anim.mode){ animStart("single", 0); return; }
  anim.playing = !anim.playing;
  // If restarting a finished single/together, replay from the top.
  if(anim.playing){
    if(anim.mode === "single"    && anim.t >= ANIM_DURATION) anim.t = 0;
    if(anim.mode === "together"){
      const c = playablePathCount();
      if(anim.t >= togetherCycle(c)) anim.t = 0;
    }
  }
  syncAnimButtons();
}
function animStop(){
  // Wipes the whole animation state; paths render statically again.
  anim.mode = null;
  anim.t = 0;
  anim.playing = false;
  syncAnimButtons();
}
function animToggleRepeat(){
  anim.repeat = !anim.repeat;
  syncAnimButtons();
}
// Per-path progress for the current frame. Only ever called when
// anim.mode is truthy; returns 0..1 for the given path index/position.
function pathProgress(idxInPlayable, count){
  if(anim.mode === "together"){
    const localT = anim.t - idxInPlayable * ALL_STAGGER;
    if(localT <= 0) return 0;
    return Math.min(1, localT / ANIM_DURATION);
  }
  // single & seq: only the focus path animates
  if(idxInPlayable !== anim.index) return 0;
  return Math.min(1, anim.t / ANIM_DURATION);
}

  `<button id="animNext"   title="Next path"     aria-label="Next path">${Icons.next}</button>` +
  `<button id="animStop"   title="Stop"          aria-label="Stop and return to static view">${Icons.stop}</button>` +
  `<button id="animAll"    title="All at once (staggered)"  aria-label="Animate all together">ALL</button>` +
  `<button id="animSeq"    title="One by one"    aria-label="Cycle paths one by one">ONE</button>` +
  `<button id="animRepeat" title="Repeat"        aria-label="Repeat animation">${Icons.repeat}</button>`;
const animPlayBtn   = document.getElementById("animPlay");
const animStopBtn   = document.getElementById("animStop");
const animAllBtn    = document.getElementById("animAll");
const animSeqBtn    = document.getElementById("animSeq");
const animRepeatBtn = document.getElementById("animRepeat");
document.getElementById("animPrev").onclick = () => animStart("single", -1);
document.getElementById("animNext").onclick = () => animStart("single", +1);
animPlayBtn.onclick   = animTogglePlay;
animStopBtn.onclick   = animStop;
animAllBtn.onclick    = () => animStart("together", 0);
animSeqBtn.onclick    = () => animStart("seq", 0);
animRepeatBtn.onclick = animToggleRepeat;
function syncAnimButtons(){
  const isPlaying = anim.mode && anim.playing;
  animPlayBtn.innerHTML = isPlaying ? Icons.pause : Icons.play;
  const label = isPlaying ? "Pause" : "Play";
  animPlayBtn.title = label; animPlayBtn.setAttribute("aria-label", label);
  animAllBtn   .classList.toggle("on", anim.mode === "together");
  animSeqBtn   .classList.toggle("on", anim.mode === "seq");
  animRepeatBtn.classList.toggle("on", anim.repeat);
}
syncAnimButtons();
