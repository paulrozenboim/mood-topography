<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Topography of Us — Archive</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  html,body{overflow:auto}
  .archive{max-width:1280px;margin:0 auto;padding:var(--pad)}
  .archive header{display:flex;align-items:baseline;justify-content:space-between;
    gap:14px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid var(--hair)}
  .archive h1{font-size:clamp(22px,3.4vw,36px);font-weight:800;font-variation-settings:'wdth' 118;
    text-transform:uppercase;letter-spacing:-.01em;line-height:1.05}
  .archive .head-meta{font-family:'Martian Mono',monospace;font-size:10.5px;color:var(--ink-3);
    letter-spacing:.1em;text-transform:uppercase}
  .archive .head-meta b{color:var(--ink-2)}

  .archive .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
  .archive .filters .chip{font-family:'Martian Mono',monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;padding:8px 12px;box-shadow:inset 0 0 0 1px var(--hair);color:var(--ink-2);
    cursor:pointer;background:none}
  .archive .filters .chip:hover{color:var(--ink)}
  .archive .filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit;
    box-shadow:inset 0 0 0 1px var(--hair);transition:box-shadow .15s}
  .card:hover{box-shadow:inset 0 0 0 1px var(--ink-3)}
  .card .thumb{position:relative;aspect-ratio:1.4;background:var(--bg-2);overflow:hidden}
  .card .thumb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .card .meta{padding:10px 12px 12px;font-family:'Martian Mono',monospace;font-size:10px;
    letter-spacing:.06em;color:var(--ink-3);line-height:1.5}
  .card .meta .from{color:var(--ink);font-weight:600;text-transform:uppercase;letter-spacing:.08em;
    font-size:10.5px;margin-bottom:3px}
  .card .meta .count{color:var(--ink-2)}
  .card .meta .when{margin-top:4px;font-size:9.5px}
  .card .meta .seeded{display:inline-block;margin-left:6px;padding:1px 5px;font-size:8.5px;
    background:var(--hair);color:var(--ink-3);letter-spacing:.14em}

  /* Per-card action buttons — sit over the thumbnail so they're reachable
     without breaking the card-wide anchor. Nested buttons inside <a> are
     handled with preventDefault on click, not by nesting HTML validators like. */
  .card{position:relative}
  .card-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:2;opacity:0;
    transition:opacity .15s}
  .card:hover .card-actions,.card:focus-within .card-actions{opacity:1}
  .card-actions .act{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;
    padding:0;border:none;background:rgba(0,0,0,.55);color:#fff;font-family:'Martian Mono',monospace;
    font-size:12px;line-height:1;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
  .card-actions .act:hover{background:rgba(0,0,0,.85)}
  .card-actions .act.danger:hover{background:var(--line-f)}
  /* On touch devices actions are always visible — no hover state to rely on. */
  @media (hover:none){ .card-actions{opacity:1} }

  .empty{padding:80px 22px;text-align:center;color:var(--ink-2);font-family:'Martian Mono',monospace;
    font-size:12px;line-height:1.7}
  .empty a{color:var(--ink);text-decoration:underline}
</style>
</head>
<body>
<div class="archive">
  <header>
    <div>
      <div class="eyebrow">Archive</div>
      <h1>Every cast, in order</h1>
    </div>
    <div class="head-meta" id="headMeta"></div>
  </header>

  <div class="filters" id="filters">
    <button class="chip" data-filter="all"    aria-pressed="true">All</button>
    <button class="chip" data-filter="real"   aria-pressed="false">Real casts only</button>
    <button class="chip" data-filter="seeded" aria-pressed="false">Demo only</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script src="assets/remote-config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/core.js"></script>
<script src="assets/nav.js"></script>
<script>
"use strict";
const grid = document.getElementById("grid");
const headMeta = document.getElementById("headMeta");
const filters = document.getElementById("filters");
let filterMode = "all";

initQuickNav({current:"archive"});
document.documentElement.dataset.theme = Store.theme.projection || "dark";

function fmtDate(t){
  if(!t) return "";
  try{
    return new Date(t).toLocaleString([], {dateStyle:"medium", timeStyle:"short"});
  }catch(_){ return "" }
}

function render(){
  // newest first — sort defensive-copy so we don't mutate Store.paths
  let paths = Store.paths.slice().sort((a,b)=>(b.t||0)-(a.t||0));
  if(filterMode==="real")   paths = paths.filter(p=>!p.seeded);
  if(filterMode==="seeded") paths = paths.filter(p=>p.seeded);

  const total = Store.paths.length;
  const real = Store.paths.filter(p=>!p.seeded).length;
  const seed = total - real;
  headMeta.innerHTML = `<b>${total}</b> total &middot; <b>${real}</b> real &middot; <b>${seed}</b> demo`;

  if(!paths.length){
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">No paths in this session yet.<br><br>
      <a href="tablet.html">Trace one on the Cast Path page &rarr;</a></div>`;
    return;
  }

  grid.innerHTML = "";
  const theme = Store.theme.projection || "dark";
  for(const p of paths){
    const anchor = NODES[p.nodes[0]] || {n:"?"};
    const url = `view.html#p=${encodePath(p.nodes)}${p.t?"&t="+encodeTime(p.t):""}`;
    const card = document.createElement("a");
    card.className = "card";
    card.href = url;
    card.target = "_blank";
    card.rel = "noopener";
    card.innerHTML = `
      <div class="card-actions" data-id="${p.id}">
        <button type="button" class="act" data-act="print" title="Print this constellation" aria-label="Print">⎙</button>
        <button type="button" class="act danger" data-act="delete" title="Remove from archive" aria-label="Delete">×</button>
      </div>
      <div class="thumb"><canvas></canvas></div>
      <div class="meta">
        <div class="from">${anchor.n}${p.seeded?'<span class="seeded">DEMO</span>':''}</div>
        <div class="count">${p.nodes.length} stations</div>
        <div class="when">${fmtDate(p.t)}</div>
      </div>`;
    grid.appendChild(card);
    // render the thumbnail after the DOM lands so the canvas parent has size
    const canvas = card.querySelector("canvas");
    requestAnimationFrame(()=>renderConstellation(canvas, p.nodes, theme));
  }
}

filters.addEventListener("click", ev => {
  const btn = ev.target.closest(".chip[data-filter]"); if(!btn) return;
  filterMode = btn.dataset.filter;
  [...filters.children].forEach(b=>b.setAttribute("aria-pressed", b===btn ? "true" : "false"));
  render();
});

// Card action buttons — event delegation. Intercepts before the anchor's
// default navigation so clicking Print or Delete doesn't also open the card.
grid.addEventListener("click", ev => {
  const act = ev.target.closest(".card-actions .act");
  if(!act) return;
  ev.preventDefault();
  ev.stopPropagation();
  const id = act.parentElement.dataset.id;
  const p = Store.paths.find(x=>x.id===id);
  if(!p) return;
  if(act.dataset.act === "delete"){
    if(confirm(`Remove this path (${NODES[p.nodes[0]].n} → ${p.nodes.length} stations) from the archive?\nThis can't be undone.`)){
      Store.removePath(id);
    }
  } else if(act.dataset.act === "print"){
    // Open view.html in a new tab with ?print=1 — view.html auto-triggers the
    // browser print dialog and uses its own thermal-friendly print CSS.
    const url = `view.html?print=1#p=${encodePath(p.nodes)}${p.t?"&t="+encodeTime(p.t):""}`;
    window.open(url, "_blank", "noopener");
  }
});

Store.sub(render);
render();
Sync.hello();
</script>
</body>
</html>
