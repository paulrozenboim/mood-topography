<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<!-- Operator surface. Renaming the landing page keeps a stranger who types the
     bare URL out; this keeps the page out of search results, which is the other
     way people arrive somewhere they were never linked to. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Mood Topography — Live wall</title>
<link rel="stylesheet" href="assets/style.css?v=20260818-manifest">
</head>
<body>
<div id="app">
  <div class="canvas-wrap">
    <canvas id="cv"></canvas>
    <div class="proj-head">
      <div class="proj-title">The Mood Topography<small>Live civic map · Manifest — Who Cares Festival</small></div>
    </div>
    <div class="proj-stats-side" id="stats"></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="bulletin-bar">
    <div class="bar"><span class="tag" id="tag">Service notice</span><h1 class="line" id="line"></h1></div>
    <div class="sub" id="sub"></div>
    <div class="cast-loader" id="castLoader" hidden><span></span></div>
  </div>
</div>
<script src="assets/icons.js?v=20260818-manifest"></script>
<script src="assets/remote-config.js?v=20260818-manifest"></script>
<script src="assets/store.js?v=20260818-manifest"></script>
<script src="assets/core.js?v=20260818-manifest"></script>
<script src="assets/nav.js?v=20260818-manifest"></script>
<script src="assets/syncpill.js?v=20260818-manifest"></script>
<script>
"use strict";
const el=(tag,cls,html)=>{const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e};

const cv=document.getElementById("cv");
const view=new MapView(cv,{role:"projection", labels:true, showAggregate:true, navigable:true});
// The right side has the vertical stats column — nudging the whole map 50px
// right centers it against the stats/legend chrome instead of dead-center on
// the raw canvas. Preserved across resetView so double-click / Fit stays here.
const MAP_INITIAL_DX = 50;
view.user.dx = MAP_INITIAL_DX; view.dirty = true;
const _origReset = view.resetView.bind(view);
view.resetView = () => { _origReset(); view.user.dx = MAP_INITIAL_DX; view.dirty = true; };
// Reverse lookup for CATS: full mood name (e.g. "Friction & Resistance") → key.
// Used by the bulletin painter to colour {Mood Name} spans by their category.
const CAT_BY_NAME=Object.fromEntries(Object.entries(CATS).map(([k,v])=>[v.name,k]));

const legend=document.getElementById("legend");
// Small title above the coloured swatches so a viewer parses the block as
// "these are the four mood categories the map is organised around", not as an
// arbitrary color key.
const legendTitle=el("div","legend-title","Moods");
legend.appendChild(legendTitle);
Object.entries(CATS).forEach(([k,v])=>{
  const d=el("div"); const i=el("i"); i.style.background=v.color; d.appendChild(i);
  d.appendChild(el("span",null,v.name)); legend.appendChild(d);
});

const tag=document.getElementById("tag"), line=document.getElementById("line"), sub=document.getElementById("sub");
const stats=document.getElementById("stats");
// Bulletin transport state — governs the auto-rotation loop below.
let paused = false, bulletinHidden = false;

initSyncPill({mount:document.querySelector(".proj-head")});
initQuickNav({current:"projection", actions:[
  {html: Icons.fit,        title:"Fit view",          onClick:()=>view.resetView()},
  {html: Icons.prev,       title:"Previous bulletin", onClick:()=>prevBulletin()},
  {html: Icons.pause,      title:"Pause bulletin",    onClick:()=>togglePause()},
  {html: Icons.next,       title:"Next bulletin",     onClick:()=>nextBulletin()},
  {html: Icons.eyeOn,      title:"Hide bulletin",     onClick:()=>toggleBulletinVisibility()},
  {html: Icons.fullscreen, title:"Fullscreen",        onClick:()=>toggleFullscreen()},
  {html: Icons.theme,      title:"Toggle theme",      onClick:()=>Store.setTheme(Store.theme==="dark"?"light":"dark")}
]});

// Fullscreen — clears the browser chrome off the projected image. Same control
// as the kiosk, but it lives in the quick-nav here so nothing floats over the
// wall while the show is running. Also still bound to the `f` key below.
const fullscreenBtn = document.querySelector('.quicknav [aria-label="Fullscreen"]');
function toggleFullscreen(){
  const d = document.documentElement;
  if(document.fullscreenElement) document.exitFullscreen?.();
  else (d.requestFullscreen?.({navigationUI:"hide"}) ?? d.webkitRequestFullscreen?.())?.catch?.(()=>{});
}
function syncFullscreenBtn(){
  if(!fullscreenBtn) return;
  const on = !!document.fullscreenElement;
  fullscreenBtn.innerHTML = on ? Icons.fullscreenExit : Icons.fullscreen;
  const label = on ? "Exit fullscreen" : "Fullscreen";
  fullscreenBtn.title = label; fullscreenBtn.setAttribute("aria-label", label);
}
document.addEventListener("fullscreenchange", syncFullscreenBtn);

// Grab refs to the transport / visibility buttons so we can swap their icons
// when their state flips. Located via aria-label (set by initQuickNav from the
// title field on each action).
const transportBtn  = document.querySelector('.quicknav [aria-label="Pause bulletin"]');
const visibilityBtn = document.querySelector('.quicknav [aria-label="Hide bulletin"]');

let queue=[], qi=0, lastSwap=0, current=null;

function togglePause(){
  paused = !paused;
  if(!transportBtn) return;
  transportBtn.innerHTML = paused ? Icons.play : Icons.pause;
  const label = paused ? "Play bulletin" : "Pause bulletin";
  transportBtn.title = label;
  transportBtn.setAttribute("aria-label", label);
}
function nextBulletin(){
  if(!queue.length) rebuild();
  if(!queue.length) return;
  paint(queue[qi % queue.length]);
  qi++;
  lastSwap = performance.now();
}
function prevBulletin(){
  if(!queue.length) rebuild();
  if(!queue.length) return;
  // qi points at the NEXT bulletin, so "previous" is qi-2 relative to that.
  qi = (qi - 2 + queue.length) % queue.length;
  paint(queue[qi % queue.length]);
  qi++;
  lastSwap = performance.now();
}
function toggleBulletinVisibility(){
  bulletinHidden = !bulletinHidden;
  bulletinBar.classList.toggle("collapsed", bulletinHidden);
  if(!visibilityBtn) return;
  visibilityBtn.innerHTML = bulletinHidden ? Icons.eyeOff : Icons.eyeOn;
  const label = bulletinHidden ? "Show bulletin" : "Hide bulletin";
  visibilityBtn.title = label;
  visibilityBtn.setAttribute("aria-label", label);
}
const reduced=matchMedia("(prefers-reduced-motion:reduce)").matches;
const GLYPH="▚▞▛▜▙▟█▖▗▘▝";
// One live scramble interval at a time — a new bulletin cancels the previous
// one so intervals never overlap and race for line.innerHTML.
let scrambleIv=null;
function scramble(node, text, onDone){
  clearInterval(scrambleIv); scrambleIv=null;
  if(reduced){ node.innerHTML=text; onDone&&onDone(); return }
  const chars=[...text]; let f=0;
  scrambleIv=setInterval(()=>{
    f++;
    node.innerHTML=chars.map((ch,i)=>{
      if(ch===" ") return " ";
      if(i < f*2.2) return ch;
      return `<span style="opacity:.35">${GLYPH[(Math.random()*GLYPH.length)|0]}</span>`;
    }).join("");
    if(f*2.2>chars.length){
      clearInterval(scrambleIv); scrambleIv=null;
      // Final swap happens INSIDE the callback so the caller can install
      // rich HTML (with per-station color spans) instead of plain text.
      onDone ? onDone() : (node.innerHTML=text);
    }
  },26);
}
const bulletinBar = document.querySelector(".bulletin-bar");
function paint(b){
  current=b;
  bulletinBar.classList.toggle("celebrate", !!b.celebrate);
  // Kick the CSS animation on every celebration paint even if the class was
  // already on (previous cast still fresh) — clone the node's own class list.
  if(b.celebrate){
    bulletinBar.classList.remove("celebrate-flash");
    void bulletinBar.offsetWidth;                     // force reflow
    bulletinBar.classList.add("celebrate-flash");
  } else {
    bulletinBar.classList.remove("celebrate-flash");
  }
  tag.textContent=b.tag;
  const accent = b.accent ? catColor(b.accent, Store.theme) : null;
  line.style.setProperty("--accent", accent||"");
  // Each {name} resolves to a specific color: station name → its category
  // color; category name → that category's color. Anything else (numbers,
  // free text) falls back to --accent.
  const html=b.line.replace(/\{([^}]+)\}/g, (_,m)=>{
    let col = null;
    const node = NODE_BY_NAME[m];
    if(node) col = catColor(node.c, Store.theme);
    else if(CAT_BY_NAME[m]) col = catColor(CAT_BY_NAME[m], Store.theme);
    return col ? `<span class="hi" style="color:${col}">${m}</span>`
               : `<span class="hi">${m}</span>`;
  });
  // Scramble runs first; when it finishes, install the styled HTML so the
  // per-station color spans actually appear. The old fixed 520ms setTimeout
  // fired *during* scrambling on longer bulletins and got overwritten back
  // to plain text — hence "text is only white".
  scramble(line, html.replace(/<[^>]+>/g,""), ()=>{
    if(current===b) line.innerHTML=html;
  });
  sub.textContent=b.sub||"";
  view.setFocus(b.focus||null);
}
function rebuild(){ queue=bulletins(view.A||analyse(activePaths())); if(qi>=queue.length) qi=0 }
function tick(ts){
  if(!queue.length) rebuild();
  // Paused: freeze the auto-rotation entirely. Next/prev clicks still advance
  // manually since they call paint() + set lastSwap themselves.
  if(!paused && ts-lastSwap > (current&&current.hold?11000:8500)){
    lastSwap=ts; rebuild();
    if(queue.length){ paint(queue[qi%queue.length]); qi++ }
  }
  const A=view.A||analyse(activePaths());
  stats.innerHTML=`<div class="stat"><b>${A.real}</b><span>journeys cast</span></div>`+
    `<div class="stat"><b>${A.distinct}</b><span>distinct routes</span></div>`+
    `<div class="stat"><b>${A.edgeList.length}</b><span>active links</span></div>`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// "outlier" removed from the rotation on purpose — it hides everything else
// on the map, and the Sole-Traveller bulletin ("Nobody else did") reads much
// better against a dimmed crowd than against a blank map. Filter stays
// available in Settings for manual VJ use, just not in the auto cycle.
const AUTO=[{type:"all"},{type:"recent"},{type:"heaviest"},{type:"cat",c:"F"},{type:"all"},{type:"cat",c:"M"}];
let ai=0;
/* Auto-pilot drives THIS screen and stays off the wire.
   It used to broadcast, which meant one durable message every 14 seconds —
   257 an hour, and 82% of a night's log turned out to be view changes rather
   than anything that happened. That flooded the replay window every other
   client hydrates from. A manual choice in Settings still broadcasts and still
   locks the wall; only the cycling is local now. (The trade: while auto-pilot
   is running, Settings no longer highlights which view is currently up.)

   It also holds off entirely while a cast is playing. Rotating to "heaviest"
   fifteen seconds after someone cast would drop their brand-new path straight
   back off the map — which is exactly what it looked like when a path
   "didn't show". */
let castHoldUntil = 0;
setInterval(()=>{
  if(!Store.auto) return;
  if(performance.now() < castHoldUntil) return;
  ai=(ai+1)%AUTO.length;
  Store.setFilter(AUTO[ai], {broadcast:false});
},14000);

Store.sub(evt=>{
  document.documentElement.dataset.theme=Store.theme;
  view.dirty=true;
  if(evt.type==="path" && evt.animate){
    castChoreography(evt.path);
  }
  if(evt.type==="reset"){ qi=0; lastSwap=-1e9 }
  if(evt.type==="remove"){ view.dirty=true; lastSwap=-1e9 }
});

/* ============================================================
   CAST CHOREOGRAPHY

   Four beats. The first one is the whole point of the rewrite: someone hands
   the tablet back, and the walk from the kiosk to where they can see the wall
   takes a few seconds. The drawing used to start immediately, so by the time
   they looked up their path was already sitting there among four hundred
   others, indistinguishable. Now the wall announces it first and counts down
   in the open, and the drawing waits for them.

     0.0 s   NEW PATH DETECTED, loader bar starts filling, status lines cycle
     6.0 s   the path draws itself across the map
    10.5 s   what the map makes of it
    ~12  s   auto-pilot resumes
   ============================================================ */
const CAST_ANNOUNCE_MS = 6000;
const castLoader = document.getElementById("castLoader");
let castTimers = [], castSubIv = null;

function castChoreography(path){
  // A second cast landing mid-sequence takes over rather than layering on top
  // of the first — two people casting twenty seconds apart is normal, and two
  // overlapping countdowns would be nonsense.
  castTimers.forEach(clearTimeout); castTimers = [];
  clearInterval(castSubIv);

  const anchor = NODES[path.nodes[0]];
  const dest   = NODES[path.nodes[path.nodes.length - 1]];
  const others = Math.max(0, activePaths().length - 1);

  // Hold the wall for the whole sequence: no bulletin rotation, no filter
  // rotation, and — while auto-pilot is in charge — the full map, so the new
  // route is seen joining the others rather than arriving into an empty frame.
  const total = CAST_ANNOUNCE_MS + 6000;
  castHoldUntil = performance.now() + total;
  lastSwap      = performance.now() + total;
  if(Store.auto) Store.setFilter({type:"all"}, {broadcast:false});

  // --- beat 1: announce
  paint({
    tag: "✦ Incoming",
    accent: anchor.c,
    line: "New path detected",
    sub: "",
    focus: null,
    celebrate: true
  });
  castLoader.hidden = false;
  castLoader.classList.remove("run");
  void castLoader.offsetWidth;                       // restart the fill animation
  castLoader.style.setProperty("--castdur", CAST_ANNOUNCE_MS + "ms");
  castLoader.classList.add("run");

  const steps = [
    `Receiving from the kiosk`,
    `Reading <b>${path.nodes.length}</b> stations`,
    others ? `Finding its place among <b>${others}</b> journeys`
           : `The first journey of the night`,
    `Drawing it now`
  ];
  let si = 0;
  sub.innerHTML = steps[0];
  castSubIv = setInterval(()=>{
    si++;
    if(si >= steps.length){ clearInterval(castSubIv); castSubIv = null; return }
    sub.innerHTML = steps[si];
  }, CAST_ANNOUNCE_MS / steps.length);

  // --- beat 2: draw it
  castTimers.push(setTimeout(()=>{
    clearInterval(castSubIv); castSubIv = null;
    castLoader.classList.remove("run");
    castLoader.hidden = true;
    paint({
      tag: "✦ New cast",
      accent: anchor.c,
      line: `A new path joins the wall — from {${anchor.n}} to {${dest.n}}.`,
      sub: `Watch it draw itself across the map`,
      focus: null,
      celebrate: true
    });
    view.playInjection(path);
  }, CAST_ANNOUNCE_MS));

  // --- beat 3: what it means
  castTimers.push(setTimeout(()=>{
    paint(castBulletin(path, activePaths()));
    lastSwap = performance.now() + 1500;             // ~7 s of insight, then rotate
  }, CAST_ANNOUNCE_MS + 4500));
}

document.addEventListener("keydown",e=>{
  if(e.key==="t")Store.setTheme("projection",Store.theme==="dark"?"light":"dark");
  if(e.key==="r")view.resetView();
  if(e.key==="f") toggleFullscreen();
  if(e.key==="p"||e.key==="P") screenshotFullPage();
});

// Full-page screenshot (P). Composites the wall canvas + every DOM overlay
// (title, stats, legend, bulletin bar) into a single PNG. Approach:
//   1. Snapshot the <canvas> to a data URL — foreignObject can't render live
//      <canvas> pixels, only DOM.
//   2. Clone the body, swap the canvas for an <img> at the same box.
//   3. Inline every stylesheet and rewrite relative url() refs to absolute
//      so @font-face resources still resolve under the SVG's blob origin.
//      Cross-origin fonts load because sync-server sets Allow-Origin: *.
//   4. Wrap the whole clone in an SVG <foreignObject>, draw the SVG onto an
//      output canvas at 2× DPR, save.
// Falls back to a canvas-only PNG if the SVG image fails to load or the
// output canvas is tainted (e.g. font served without CORS in cloud mode).
function screenshotFullPage(){
  const w = innerWidth, h = innerHeight, dpr = 2;
  const filename = `mood-topography-projection-${Date.now()}.png`;
  const saveDataUrl = url => { const a=document.createElement("a"); a.download=filename; a.href=url; a.click(); };

  let cvUrl;
  try { cvUrl = cv.toDataURL("image/png"); }
  catch(err){ console.warn("Screenshot: canvas snapshot failed", err); return saveCanvasOnly(); }
  const cvRect = cv.getBoundingClientRect();

  // Inline stylesheets, absolutise every url(...) so the SVG blob context
  // can still fetch them.
  const cssText = [...document.styleSheets].map(s => {
    try { return [...s.cssRules].map(r => r.cssText).join("\n"); }
    catch(err){ return ""; }
  }).join("\n").replace(/url\((["']?)([^"')]+)\1\)/g, (m, q, u) => {
    if(/^(data:|https?:|blob:)/.test(u)) return m;
    return `url("${new URL(u, location.href).href}")`;
  });

  // Clone body, replace the <canvas> with an <img> holding the snapshot.
  const clone = document.body.cloneNode(true);
  const c2 = clone.querySelector("#cv");
  if(c2){
    const img = document.createElement("img");
    img.setAttribute("src", cvUrl);
    img.setAttribute("style", `display:block;width:${cvRect.width}px;height:${cvRect.height}px`);
    c2.replaceWith(img);
  }
  // Strip anything invisible or interactive-only so it doesn't leak into the frame.
  clone.querySelectorAll(".nav-handle,.quicknav,script").forEach(n => n.remove());

  const theme = document.documentElement.dataset.theme || "dark";
  const bodyHtml = new XMLSerializer().serializeToString(clone);
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
      `<foreignObject width="100%" height="100%">` +
        `<html xmlns="http://www.w3.org/1999/xhtml" data-theme="${theme}">` +
          `<head><meta charset="utf-8"/><style>${cssText}</style></head>` +
          bodyHtml +
        `</html>` +
      `</foreignObject>` +
    `</svg>`;

  const blob = new Blob([svg], {type:"image/svg+xml;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const img2 = new Image();
  img2.onload = () => {
    URL.revokeObjectURL(url);
    const out = document.createElement("canvas");
    out.width = w*dpr; out.height = h*dpr;
    const oc = out.getContext("2d");
    oc.drawImage(img2, 0, 0, w, h);
    try { saveDataUrl(out.toDataURL("image/png")); }
    catch(err){ console.warn("Screenshot: output canvas tainted", err); saveCanvasOnly(); }
  };
  img2.onerror = err => {
    URL.revokeObjectURL(url);
    console.warn("Screenshot: SVG render failed, falling back to canvas-only", err);
    saveCanvasOnly();
  };
  img2.src = url;
  function saveCanvasOnly(){
    try { saveDataUrl(cv.toDataURL("image/png")); }
    catch(err){ alert("Screenshot failed. Use OS screenshot (Win+Shift+S) instead."); }
  }
}

Sync.hello();
</script>
</body>
</html>
